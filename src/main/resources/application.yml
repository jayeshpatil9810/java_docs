spring:
  application:
    name: shutterstockApi-dev

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:mysql://localhost:3306/shutterstock
    username: root
    password: Suvam@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 100
      idle-timeout: 10000
      connection-timeout: 60000
      pool-name: ShutterstockHikariCP
      connection-test-query: SELECT 1
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: true


