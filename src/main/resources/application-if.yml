spring:
  application:
    name: shutterstockApi-image-footage

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:mysql://localhost:3306/sstk_image_footage
    username: root
    password: Sstk@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 100
      idle-timeout: 10000
      connection-timeout: 60000
      pool-name: ShutterstockHikariCP
      connection-test-query: SELECT 1
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8081

logging:
  file:
    name: sstk-if.log
    